name: Release

# Builds the packages for every platform. On a version tag (v1.2.3) it also
# publishes them as a GitHub Release; a manual run ("Run workflow") only keeps
# them as workflow artifacts, which is how to test a build without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  QT_VERSION: '6.10.3'
  NDK_VERSION: '27.2.12479018'   # the NDK Qt 6.10 for Android is built with

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -nE 's/^project\(QrReader VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The packages take their version from CMakeLists.txt, so a tag that
          # says otherwise would publish mislabelled files.
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)."
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022   # has NSIS, which CPack uses for the installer
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Build and package
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")"
          cmake --build build --config Release
          cd build && cpack -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/QrReader-*.exe
            build/QrReader-*.zip

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Build and package
        run: |
          # Qt's macOS libraries are universal, so build for both Apple
          # Silicon and Intel Macs.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j
          cd build && cpack
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/QrReader-*.dmg

  linux:
    needs: version
    # The oldest supported Ubuntu, so the AppImage also runs on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j
          cmake --install build --prefix AppDir/usr
      - name: Package as AppImage
        run: |
          # Qt's xcb plugin needs libxcb-cursor, which a stock Ubuntu 22.04
          # does not have. Everything else comes from the Qt deployment.
          cp -L /usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 AppDir/usr/lib/
          cp platform/qrreader.desktop AppDir/
          cp icon/appicon.png AppDir/qrreader.png
          # The binary's RUNPATH already points at ../lib, so AppRun can be the
          # binary itself, with no LD_LIBRARY_PATH to leak into the browser
          # that "Open link" starts.
          ln -s usr/bin/qrreader AppDir/AppRun
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir \
            "QrReader-${{ needs.version.outputs.version }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: QrReader-*.AppImage

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Also installs the desktop Qt that Android builds need for their host
      # tools, and points QT_HOST_PATH at it.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The ANDROID_KEYSTORE_* repository secrets are not set (see README, 'Releasing')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" \
            -DQT_HOST_PATH="$QT_HOST_PATH" -DQT_ANDROID_SIGN_APK=ON
          cmake --build build --target apk
          cp build/android-build/build/outputs/apk/release/android-build-release-signed.apk \
            "QrReader-${{ needs.version.outputs.version }}-android-arm64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: QrReader-*.apk

  release:
    needs: [windows, macos, linux, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
